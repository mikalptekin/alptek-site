<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Flappy | Jeu Viral</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background: #0a0a14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            width: 100dvw;
            overflow: hidden;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            touch-action: manipulation;
            cursor: pointer;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a14;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-height: 100vh;
            max-height: 100dvh;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255, 0, 200, 0.3), 0 0 80px rgba(0, 200, 255, 0.2);
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            z-index: 10;
        }
        .score-panel {
            pointer-events: none;
            text-align: center;
            margin-top: env(safe-area-inset-top, 16px);
        }
        .current-score {
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, #ffb3ff 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px #ff00c8);
            line-height: 1;
        }
        .best-score {
            font-size: 14px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }
        .best-score span {
            color: #0ff;
            font-weight: 700;
        }

        .message-popup {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            font-size: 32px;
            color: #ffd700;
            text-shadow: 0 0 30px #ff00c8, 0 0 60px #ff00c8;
            animation: popUp 0.8s ease-out forwards;
            z-index: 20;
            white-space: nowrap;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
        }
        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            60% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            background: rgba(5, 5, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 8px;
        }
        /* ✅ Correction : on cache VRAIMENT l'écran, plus de piège de transparence */
        .overlay-screen.hidden {
            display: none;
        }

        .title {
            font-size: 52px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff00c8, #0ff, #ff00c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px #ff00c8);
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: -1px;
            animation: titleGlow 2s infinite alternate;
        }
        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 20px #ff00c8); }
            100% { filter: drop-shadow(0 0 50px #0ff); }
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 32px;
        }
        .btn {
            pointer-events: all;
            background: linear-gradient(135deg, #ff00c8, #7000ff);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 16px 44px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 0, 200, 0.5);
            transition: all 0.3s;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn:active {
            transform: scale(0.94);
            box-shadow: 0 4px 15px rgba(255, 0, 200, 0.4);
        }
        .gameover-score {
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 25px #ff00c8;
            margin-bottom: 4px;
        }
        .gameover-best {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
        }
        .gameover-best span {
            color: #0ff;
            font-weight: 700;
        }
        .share-row {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .share-btn {
            pointer-events: all;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            border-radius: 50px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            transition: 0.3s;
        }
        .share-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            .current-score { font-size: 48px; }
            .title { font-size: 38px; }
            .btn { padding: 14px 32px; font-size: 17px; }
            .gameover-score { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <canvas id="gameCanvas" aria-label="Neon Flappy game canvas"></canvas>

        <div class="ui-layer" id="uiLayer">
            <div class="score-panel">
                <div class="current-score" id="scoreDisplay">0</div>
                <div class="best-score">Meilleur <span id="bestDisplay">0</span></div>
            </div>
        </div>

        <!-- Écran d'accueil -->
        <div class="overlay-screen" id="startScreen">
            <div class="title">NEON<br>FLAPPY</div>
            <div class="subtitle">Tape pour voler</div>
            <button class="btn" id="startBtn">▶ JOUER</button>
            <div class="gameover-best" style="margin-top:20px;">🏆 Meilleur : <span id="startBest">0</span></div>
        </div>

        <!-- Écran de fin de partie -->
        <div class="overlay-screen hidden" id="gameOverScreen">
            <div class="gameover-score" id="gameOverScore">0</div>
            <div class="gameover-best">Meilleur : <span id="gameOverBest">0</span></div>
            <button class="btn" id="retryBtn">↺ REJOUER</button>
            <div class="share-row">
                <button class="share-btn" id="shareBtn">📤 Partager</button>
                <button class="share-btn" id="copyBtn">📋 Copier score</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // DOM
            const container = document.getElementById('gameContainer');
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const bestDisplay = document.getElementById('bestDisplay');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startBtn = document.getElementById('startBtn');
            const retryBtn = document.getElementById('retryBtn');
            const shareBtn = document.getElementById('shareBtn');
            const copyBtn = document.getElementById('copyBtn');
            const gameOverScoreEl = document.getElementById('gameOverScore');
            const gameOverBestEl = document.getElementById('gameOverBest');
            const startBestEl = document.getElementById('startBest');

            // Audio
            let audioCtx = null;
            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }
            function playBeep(freq, duration, type = 'square', vol = 0.08) {
                if (!audioCtx) return;
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + duration);
            }
            function sfxJump() { playBeep(600, 0.1, 'square', 0.06); playBeep(800, 0.08, 'square', 0.04); }
            function sfxScore() { playBeep(900, 0.12, 'triangle', 0.07); playBeep(1200, 0.1, 'triangle', 0.05); }
            function sfxDeath() { playBeep(150, 0.2, 'sawtooth', 0.1); playBeep(100, 0.25, 'sawtooth', 0.08); }

            // Canvas resize
            function resize() {
                const cw = container.clientWidth;
                const ch = container.clientHeight;
                const maxW = 480;
                const w = Math.min(cw, maxW);
                const aspect = 1.7;
                let h = w * aspect;
                if (h > ch * 0.95) h = ch * 0.95;
                canvas.width = w;
                canvas.height = h;
            }
            window.addEventListener('resize', resize);
            window.addEventListener('orientationchange', () => setTimeout(resize, 100));
            resize();

            function getGameUnits() {
                const H = canvas.height, W = canvas.width;
                return {
                    H, W,
                    birdX: W * 0.22,
                    birdRadius: H * 0.035,
                    gravity: H * 1.2,
                    jumpVelocity: -H * 0.55,
                    pipeWidth: W * 0.14,
                    pipeGap: H * 0.3,
                    pipeSpeed: W * 0.45,
                    groundY: H * 0.88,
                    ceilingY: H * 0.05
                };
            }

            // Game state
            const STATE = { IDLE: 0, PLAYING: 1, DYING: 2, GAMEOVER: 3 };
            let state = STATE.IDLE;
            let birdY, birdVy;
            let pipes = [];
            let score = 0;
            let bestScore = 0;
            let spawnTimer = 0;
            let particles = [];
            let screenShake = 0;
            let flashAlpha = 0;
            let gameOverTimeout = null;
            let lastTime = performance.now();
            let animFrameId = null;

            function loadBest() {
                try { bestScore = parseInt(localStorage.getItem('neonFlappyBest') || '0', 10); } catch(e){ bestScore=0; }
                if (isNaN(bestScore)) bestScore = 0;
            }
            function saveBest() {
                try { localStorage.setItem('neonFlappyBest', bestScore.toString()); } catch(e){}
            }
            loadBest();
            function updateBestUI() {
                bestDisplay.textContent = bestScore;
                gameOverBestEl.textContent = bestScore;
                startBestEl.textContent = bestScore;
            }
            updateBestUI();

            function randomGapY(H) {
                return H * 0.2 + Math.random() * (H * 0.5);
            }

            function spawnDeathParticles(x, y, color) {
                for (let i=0; i<30; i++) {
                    const angle = Math.random()*Math.PI*2;
                    const speed = 150 + Math.random()*400;
                    particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 0.6+Math.random()*0.8, maxLife: 0.8, size: 2+Math.random()*6, color });
                }
            }
            function spawnScoreParticles(x, y) {
                for (let i=0; i<12; i++) {
                    const angle = -Math.PI/2 + (Math.random()-0.5)*1.2;
                    const speed = 100 + Math.random()*250;
                    particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 0.4+Math.random()*0.5, maxLife: 0.5, size: 3+Math.random()*5, color: '#ffd700' });
                }
            }

            function resetGame() {
                if (gameOverTimeout) {
                    clearTimeout(gameOverTimeout);
                    gameOverTimeout = null;
                }
                const U = getGameUnits();
                birdY = U.H * 0.5;
                birdVy = 0;
                pipes = [];
                particles = [];
                score = 0;
                spawnTimer = 0;
                screenShake = 0;
                flashAlpha = 0;
                scoreDisplay.textContent = '0';
                state = STATE.PLAYING;
                // ✅ On cache TOUT, plus aucun écran parasite
                gameOverScreen.classList.add('hidden');
                startScreen.classList.add('hidden');
            }

            function startGame() {
                initAudio();
                resetGame();
            }

            function showGameOver() {
                if (state !== STATE.DYING) return;
                state = STATE.GAMEOVER;
                if (score > bestScore) {
                    bestScore = score;
                    saveBest();
                }
                updateBestUI();
                gameOverScoreEl.textContent = score;
                gameOverBestEl.textContent = bestScore;
                gameOverScreen.classList.remove('hidden');
                sfxDeath();
            }

            function update(dt) {
                const U = getGameUnits();
                if (state === STATE.PLAYING) {
                    birdVy += U.gravity * dt;
                    birdY += birdVy * dt;
                    if (birdY - U.birdRadius < U.ceilingY) {
                        birdY = U.ceilingY + U.birdRadius;
                        birdVy = 0;
                    }
                    if (birdY + U.birdRadius > U.groundY) {
                        birdY = U.groundY - U.birdRadius;
                        birdVy = 0;
                        spawnDeathParticles(U.birdX, birdY, '#ff00c8');
                        screenShake = 0.35;
                        flashAlpha = 0.6;
                        state = STATE.DYING;
                        gameOverTimeout = setTimeout(showGameOver, 400);
                        return;
                    }
                    spawnTimer -= dt;
                    if (spawnTimer <= 0) {
                        pipes.push({
                            x: U.W + U.pipeWidth,
                            gapY: randomGapY(U.H),
                            width: U.pipeWidth,
                            passed: false
                        });
                        spawnTimer = 1.4 + Math.random() * 0.8;
                    }
                    for (let i = pipes.length-1; i>=0; i--) {
                        const p = pipes[i];
                        p.x -= U.pipeSpeed * dt;
                        const birdLeft = U.birdX - U.birdRadius;
                        const birdRight = U.birdX + U.birdRadius;
                        const birdTop = birdY - U.birdRadius;
                        const birdBottom = birdY + U.birdRadius;
                        const pipeLeft = p.x - p.width/2;
                        const pipeRight = p.x + p.width/2;
                        const gapTop = p.gapY - U.pipeGap/2;
                        const gapBottom = p.gapY + U.pipeGap/2;
                        if (birdRight > pipeLeft && birdLeft < pipeRight) {
                            if (birdTop < gapTop || birdBottom > gapBottom) {
                                spawnDeathParticles(U.birdX, birdY, '#ff0044');
                                screenShake = 0.4;
                                flashAlpha = 0.7;
                                state = STATE.DYING;
                                gameOverTimeout = setTimeout(showGameOver, 400);
                                return;
                            }
                        }
                        if (!p.passed && pipeRight < U.birdX) {
                            p.passed = true;
                            score++;
                            scoreDisplay.textContent = score;
                            sfxScore();
                            spawnScoreParticles(p.x, p.gapY);
                            if (score % 5 === 0) showMessage('🔥 x'+score);
                        }
                        if (pipeRight < -U.pipeWidth) pipes.splice(i,1);
                    }
                    updateParticles(dt);
                } else if (state === STATE.DYING || state === STATE.GAMEOVER) {
                    updateParticles(dt);
                    screenShake = Math.max(0, screenShake - dt);
                    flashAlpha = Math.max(0, flashAlpha - dt*2);
                }
            }

            function updateParticles(dt) {
                for (let i=particles.length-1; i>=0; i--) {
                    const p = particles[i];
                    p.life -= dt;
                    if (p.life <= 0) { particles.splice(i,1); continue; }
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += 400 * dt;
                }
            }

            function showMessage(text) {
                const el = document.createElement('div');
                el.className = 'message-popup';
                el.textContent = text;
                container.appendChild(el);
                setTimeout(() => el.remove(), 800);
            }

            function drawNeonCircle(x, y, r, color, glow, glowSize=15) {
                ctx.save();
                ctx.shadowColor = glow;
                ctx.shadowBlur = glowSize;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
            function drawNeonRect(x, y, w, h, color, glow) {
                ctx.save();
                ctx.shadowColor = glow;
                ctx.shadowBlur = 12;
                ctx.fillStyle = color;
                ctx.fillRect(x-w/2, y, w, h);
                ctx.restore();
            }

            function render() {
                const U = getGameUnits();
                ctx.clearRect(0, 0, U.W, U.H);
                const grad = ctx.createLinearGradient(0,0,0,U.H);
                grad.addColorStop(0,'#0a001a');
                grad.addColorStop(0.5,'#140026');
                grad.addColorStop(1,'#0a0014');
                ctx.fillStyle = grad;
                ctx.fillRect(0,0,U.W,U.H);

                ctx.strokeStyle = 'rgba(255,0,200,0.08)';
                ctx.lineWidth = 0.5;
                for (let y=U.H*0.08; y<U.H; y+=U.H*0.08) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(U.W,y); ctx.stroke(); }
                for (let x=U.W*0.08; x<U.W; x+=U.W*0.08) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,U.H); ctx.stroke(); }

                ctx.strokeStyle = '#ff00c8'; ctx.shadowColor='#ff00c8'; ctx.shadowBlur=20; ctx.lineWidth=2;
                ctx.beginPath(); ctx.moveTo(0,U.groundY); ctx.lineTo(U.W,U.groundY); ctx.stroke();
                ctx.shadowBlur=0;

                ctx.strokeStyle = '#0ff'; ctx.shadowColor='#0ff'; ctx.shadowBlur=15; ctx.lineWidth=1.5;
                ctx.beginPath(); ctx.moveTo(0,U.ceilingY); ctx.lineTo(U.W,U.ceilingY); ctx.stroke();
                ctx.shadowBlur=0;

                for (const p of pipes) {
                    const topH = p.gapY - U.pipeGap/2 - U.ceilingY;
                    drawNeonRect(p.x, U.ceilingY, p.width, topH, '#ff00c8', '#ff00c8');
                    const bottomY = p.gapY + U.pipeGap/2;
                    drawNeonRect(p.x, bottomY, p.width, U.groundY - bottomY, '#ff00c8', '#ff00c8');
                    ctx.fillStyle='#fff'; ctx.shadowColor='#ff00c8'; ctx.shadowBlur=8;
                    ctx.fillRect(p.x-p.width/2, p.gapY - U.pipeGap/2 -2, p.width, 3);
                    ctx.fillRect(p.x-p.width/2, bottomY-1, p.width, 3);
                    ctx.shadowBlur=0;
                }

                const birdYClamped = Math.max(U.ceilingY+U.birdRadius, Math.min(U.groundY-U.birdRadius, birdY));
                drawNeonCircle(U.birdX, birdYClamped, U.birdRadius, '#fff', '#0ff', 22);
                ctx.fillStyle='#0a0014';
                ctx.beginPath(); ctx.arc(U.birdX+U.birdRadius*0.25, birdYClamped-U.birdRadius*0.15, U.birdRadius*0.28, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle='#fff';
                ctx.beginPath(); ctx.arc(U.birdX+U.birdRadius*0.35, birdYClamped-U.birdRadius*0.22, U.birdRadius*0.1, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle='#ff00c8'; ctx.shadowColor='#ff00c8'; ctx.shadowBlur=12;
                ctx.beginPath(); ctx.ellipse(U.birdX-U.birdRadius*0.5, birdYClamped+U.birdRadius*0.1, U.birdRadius*0.5, U.birdRadius*0.25, 0.2, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur=0;

                for (const p of particles) {
                    const alpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb','rgba');
                    ctx.shadowColor = p.color; ctx.shadowBlur = 8;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size*alpha, 0, Math.PI*2); ctx.fill();
                }
                ctx.shadowBlur=0;

                if (flashAlpha > 0) {
                    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
                    ctx.fillRect(-10,-10,U.W+20,U.H+20);
                }
                const vignette = ctx.createRadialGradient(U.W/2, U.H/2, U.W*0.65, U.W/2, U.H/2, U.W*1.1);
                vignette.addColorStop(0,'transparent'); vignette.addColorStop(1,'rgba(0,0,0,0.5)');
                ctx.fillStyle = vignette; ctx.fillRect(0,0,U.W,U.H);
            }

            function gameLoop(timestamp) {
                let dt = (timestamp - lastTime)/1000;
                if (dt<=0) dt=0.016;
                if (dt>0.2) dt=0.2;
                lastTime = timestamp;
                resize();
                update(dt);
                render();
                animFrameId = requestAnimationFrame(gameLoop);
            }

            function handleJump(e) {
                e.preventDefault();
                initAudio();
                if (state === STATE.IDLE) startGame();
                else if (state === STATE.PLAYING) {
                    birdVy = getGameUnits().jumpVelocity;
                    sfxJump();
                    const U = getGameUnits();
                    for (let i=0;i<5;i++) {
                        particles.push({
                            x: U.birdX, y: birdY,
                            vx: (Math.random()-0.5)*60, vy: -Math.random()*120-40,
                            life:0.3, maxLife:0.3, size:3+Math.random()*3, color:'#0ff'
                        });
                    }
                } else if (state === STATE.GAMEOVER) resetGame();
            }

            canvas.addEventListener('pointerdown', handleJump);
            canvas.addEventListener('touchstart', handleJump, { passive: false });
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
                    e.preventDefault();
                    handleJump(e);
                }
            });

            startBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); startGame(); });
            retryBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); resetGame(); });
            shareBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation(); e.preventDefault();
                const text = `⚡ Neon Flappy : ${score} pts ! Meilleur : ${bestScore} | Viens battre mon score !`;
                if (navigator.share) navigator.share({title:'Neon Flappy', text, url:window.location.href}).catch(()=>{});
                else showMessage('Score copié !');
            });
            copyBtn.addEventListener('pointerdown', (e) => {
                e.stopPropagation(); e.preventDefault();
                const text = `Neon Flappy : ${score} pts (meilleur ${bestScore})`;
                if (navigator.clipboard) navigator.clipboard.writeText(text).then(()=>showMessage('📋 Copié !'));
                else showMessage('Score : '+score);
            });

            startScreen.addEventListener('pointerdown', (e) => { if (e.target === startScreen) startGame(); });
            gameOverScreen.addEventListener('pointerdown', (e) => { if (e.target === gameOverScreen) resetGame(); });

            function initialRender() { resize(); birdY = getGameUnits().H*0.5; render(); }
            initialRender();
            lastTime = performance.now();
            animFrameId = requestAnimationFrame(gameLoop);
            console.log('⚡ Neon Flappy – boutons enfin étanches !');
        })();
    </script>
</body>
</html>
